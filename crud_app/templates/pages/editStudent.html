{% extends "base.html" %}
{% block content %}

<div class="container my-3">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <h3 class="bg-primary text-white text-center py-3">
                Edit Student
            </h3>

            <form method="POST">
                {% csrf_token %}

                <!-- First Name -->
                <div class="mb-3">
                    <label class="form-label">
                        firstName
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="firstName"
                        value="{{ stud.first_name }}"
                        required>
                </div>


                <!-- Last Name -->
                <div class="mb-3">
                    <label class="form-label">
                        lastName
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="lastName"
                        value="{{ stud.last_name }}"
                        required>
                </div>


                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label">
                        email
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        name="email"
                        value="{{ stud.email }}"
                        required>
                </div>


                <!-- Phone -->
                <div class="mb-3">
                    <label class="form-label">
                        phoneNumber
                    </label>

                    <input
                        type="tel"
                        class="form-control"
                        name="phoneNumber"
                        value="{{ stud.phone_number }}"
                        required>
                </div>


                <!-- Age -->
                <div class="mb-3">
                    <label class="form-label">
                        age
                    </label>

                    <input
                        type="number"
                        class="form-control"
                        name="age"
                        min="1"
                        max="100"
                        value="{{ stud.age }}"
                        required>
                </div>


                <!-- Gender -->
                <div class="mb-3">

                    <label class="form-label">
                        gender
                    </label>

                    <div class="d-flex gap-3">

                        <!-- Male -->
                        <div class="form-check">

                            <input
                                class="form-check-input"
                                type="radio"
                                name="gender"
                                value="Male"
                                {% if stud.gender == "male" %}
                                checked
                                {% endif %}>

                            <label class="form-check-label">
                                Male
                            </label>

                        </div>


                        <!-- Female -->
                        <div class="form-check">

                            <input
                                class="form-check-input"
                                type="radio"
                                name="gender"
                                value="Female"
                                {% if stud.gender == "female" %}
                                checked
                                {% endif %}>

                            <label class="form-check-label">
                                Female
                            </label>

                        </div>


                        <!-- Other -->
                        <div class="form-check">

                            <input
                                class="form-check-input"
                                type="radio"
                                name="gender"
                                value="Other"
                                {% if stud.gender == "other" %}
                                checked
                                {% endif %}>

                            <label class="form-check-label">
                                Other
                            </label>

                        </div>

                    </div>

                </div>


                <!-- Subject -->
                <div class="mb-3">

                    <label class="form-label">
                        subject
                    </label>

                    <select
                        class="form-select"
                        name="subject"
                        required>

                        <!-- Java -->
                        <option value="Java"
                            {% if stud.subjects == "java" %}
                            selected
                            {% endif %}>
                            Java
                        </option>


                        <!-- Python -->
                        <option value="Python"
                            {% if stud.subjects == "python" %}
                            selected
                            {% endif %}>
                            Python
                        </option>


                        <!-- Mern -->
                        <option value="Mern"
                            {% if stud.subjects == "mern" %}
                            selected
                            {% endif %}>
                            MERN
                        </option>


                        <!-- React -->
                        <option value="React"
                            {% if stud.subjects == "react" %}
                            selected
                            {% endif %}>
                            React
                        </option>

                    </select>

                </div>


                <!-- Bio -->
                <div class="mb-3">

                    <label class="form-label">
                        bio
                    </label>

                    <textarea
                        class="form-control"
                        rows="4"
                        name="bio"
                        required>{{ stud.bio }}</textarea>

                </div>


                <!-- Update Button -->
                <button
                    type="submit"
                    class="btn btn-primary">
                    Update Student
                </button>


                <!-- Cancel Button -->
                <a
                    href="{% url 'student_list' %}"
                    class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

{% endblock content %}
